name: dna-energy
# Pairing and stacking energies: GFN2-xTB and B3LYP-D3(BJ) on the S22 set against CCSD(T)/CBS.
on:
  workflow_dispatch:
  push:
    paths:
      - "core/athanor_core/dna/energy.py"
      - "tools/dnadata/energy_bench.py"
      - ".github/workflows/dna-energy.yml"
permissions:
  contents: write
jobs:
  energy:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: core/environment.yml
          cache-environment: true
      - name: Benchmarks
        run: |
          set +e
          python tools/dnadata/energy_bench.py work core/athanor_core/data/dna/energy_validation.json > energy.txt 2>&1
          rc=$?
          tail -60 energy.txt
          msg=$(grep -E "^\[(PASS|FAIL)\]" energy.txt | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          if [ $rc -eq 0 ]; then echo "::notice title=dna energies::$msg"; else echo "::error title=dna energies failed::$msg"; fi
          if [ $rc -ne 0 ]; then tail -45 energy.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=log tail::/'; echo; fi
          exit $rc
      - name: Committed energy summary regenerates exactly
        if: always()
        run: |
          if [ -n "$(git status --porcelain core/athanor_core/data/dna/energy_validation.json)" ]; then
            git diff core/athanor_core/data/dna/energy_validation.json | head -40
            echo "::error title=energy data::the committed summary differs from the regenerated one"; exit 1
          fi
      - name: Publish
        if: always()
        run: |
          git config --global user.name "athanor-ci"; git config --global user.email "ci@athanor.invalid"
          for i in 1 2 3; do
            d=$(mktemp -d); git fetch -q --depth 1 origin ci-results && git worktree add -q "$d" FETCH_HEAD && \
              mkdir -p "$d/dna-energy/${GITHUB_SHA}" && cp energy.txt work/energy_report.json core/athanor_core/data/dna/energy_validation.json "$d/dna-energy/${GITHUB_SHA}/" 2>/dev/null; \
              (cd "$d" && git add -A && git commit -qm "dna-energy ${GITHUB_SHA::7}" && git push -q origin HEAD:ci-results) && break
            git worktree remove --force "$d"; sleep $((RANDOM % 20 + 5))
          done
