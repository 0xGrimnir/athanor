name: core
on:
  push:
    paths:
      - "core/**"
      - ".github/workflows/core.yml"
  workflow_dispatch:
    inputs:
      dft_benchmark:
        description: "Run the full DFT benchmark (slow)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    env:
      OMP_NUM_THREADS: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this change affect DFT results?
        id: dftscope
        run: |
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^core/(athanor_core/(engines/dft\.py|benchmark\.py|vibrations\.py|units\.py|tasks\.py|molecule\.py)|benchmarks/reference/|environment\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=DFT benchmark skipped::no DFT-relevant files changed since ${base::7}"
          fi
        shell: bash

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: core/environment.yml
          init-shell: bash
          cache-environment: true

      - name: Record environment
        run: |
          micromamba list --explicit --md5 > env-lock-${{ runner.os }}.txt
          python -c "import rdkit, psi4, scipy, numpy; print('rdkit', rdkit.__version__, 'psi4', psi4.__version__)"
          xtb --version | grep -i "xtb version" || true

      - name: Install core
        run: pip install --no-deps -e core

      - name: Linux-only engines for cross-checks (tblite; PySCF, the GPU tier's CPU path)
        if: runner.os == 'Linux'
        run: |
          pip install "tblite==0.7.0" cffi "pyscf==2.14.0"
          python -c "import numpy as np; from tblite.interface import Calculator; c=Calculator('GFN2-xTB', np.array([8,1,1]), np.array([[0,0,0.22],[0,1.43,-0.88],[0,-1.43,-0.88]])); c.set('verbosity',0); print('tblite water E', c.singlepoint().get('energy'))"

      - name: Unit, validation-suite and cross-check tests
        working-directory: core
        run: |
          python -m pytest -q -rfEs --tb=short 2>&1 | tee ../pytest-${{ runner.os }}.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Benchmark (MMFF94, GFN2-xTB)
        working-directory: core
        run: |
          python -m athanor_core.benchmark --tiers mmff94,gfn2-xtb --out ../bench-fast-${{ runner.os }} | tee ../bench-fast-${{ runner.os }}.md
          test ${PIPESTATUS[0]} -eq 0

      - name: Benchmark (DFT, B3LYP)
        if: runner.os == 'Linux' && steps.dftscope.outputs.run == 'true' && (github.event_name == 'push' || inputs.dft_benchmark)
        working-directory: core
        env:
          OMP_NUM_THREADS: "4"
        run: |
          python -m athanor_core.benchmark --tiers dft --out ../bench-dft-${{ runner.os }} | tee ../bench-dft-${{ runner.os }}.md
          test ${PIPESTATUS[0]} -eq 0

      - name: Report
        if: always()
        run: |
          for f in pytest-${{ runner.os }}.txt bench-fast-${{ runner.os }}.md bench-dft-${{ runner.os }}.md; do
            [ -f "$f" ] || continue
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            msg=$(tail -n 60 "$f" | cut -c1-240 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::notice title=${f}::${msg}"
          done

      - name: Publish results to ci-results branch
        if: always()
        run: |
          set -x
          rm -rf /tmp/res && mkdir -p /tmp/res/${{ github.sha }}/${{ runner.os }}
          cp -r pytest-*.txt bench-* env-lock-*.txt /tmp/res/${{ github.sha }}/${{ runner.os }}/ 2>/dev/null || true
          if [ -f bench-dft-${{ runner.os }}/benchmark.json ]; then mkdir -p /tmp/res/latest/${{ runner.os }} && cp -r bench-dft-${{ runner.os }} /tmp/res/latest/${{ runner.os }}/; fi
          git config --global user.name "athanor-ci"
          git config --global user.email "ci@athanor.invalid"
          for i in 1 2 3 4 5; do
            rm -rf /tmp/ci && git clone --depth 1 --branch ci-results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /tmp/ci 2>/dev/null \
              || (mkdir -p /tmp/ci && cd /tmp/ci && git init -q -b ci-results && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}")
            cp -r /tmp/res/* /tmp/ci/
            cd /tmp/ci && git add -A && git commit -q -m "CI results ${{ github.sha }} ${{ runner.os }}" || true
            if git push -q origin ci-results; then break; fi
            cd - >/dev/null; sleep $((i*7))
          done
