name: dna
# DNA Structure benchmarks: helix geometry against crystal structures, melting against measurements.
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/dnadata/**"
      - "core/athanor_core/dna/**"
      - "core/athanor_core/data/dna/**"
      - ".github/workflows/dna.yml"

permissions:
  contents: write

jobs:
  dna:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: dna
          create-args: >-
            python=3.12 numpy scipy biopython=1.84
          condarc: |
            channels: [conda-forge]
          cache-environment: true

      - name: 3DNA (BSD-3-Clause; the reference for helix geometry)
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch v2.4.9 https://github.com/x3dna-dssr/x3dna-v2.4.git ext/x3dna
          ( cd ext/x3dna/src && make -s >/dev/null )
          ls ext/x3dna/bin

      - name: Helix data and benchmarks (PDB crystal duplexes vs 3DNA)
        run: |
          set +e
          python tools/dnadata/make_data.py ext/x3dna core/athanor_core/data/dna > structure.txt 2>&1
          python tools/dnadata/build_dna.py "$PWD/ext/x3dna" core/athanor_core/data/dna work >> structure.txt 2>&1
          rc=$?
          cut -c1-400 structure.txt | grep -v "^ " | head -200
          msg=$(grep -E "^\[(PASS|FAIL)\]" structure.txt | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          if [ $rc -eq 0 ]; then echo "::notice title=helix geometry::$msg"; else echo "::error title=helix geometry failed::$msg"; fi
          exit $rc

      - name: Melting temperatures (Owczarzy 2004 measurements, Biopython)
        if: always()
        run: |
          set +e
          python tools/dnadata/validate_melting.py core/athanor_core/data/dna/melting_validation.json > melting.txt 2>&1
          rc=$?
          cat melting.txt
          msg=$(grep -E "^\[(PASS|FAIL)\]" melting.txt | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          if [ $rc -eq 0 ]; then echo "::notice title=melting::$msg"; else echo "::error title=melting failed::$msg"; fi
          exit $rc

      - name: Reference sequence around the Personal Genome trait variants (Ensembl GRCh37)
        if: always()
        run: python tools/dnadata/flanks.py core/athanor_core/data/dna/flanks.json

      - name: Committed data/dna files regenerate exactly
        if: always()
        run: |
          git diff --stat core/athanor_core/data/dna
          if [ -n "$(git status --porcelain core/athanor_core/data/dna)" ]; then
            git status --short core/athanor_core/data/dna
            echo "::error title=helix data::the committed data/dna files differ from the regenerated ones"; exit 1
          fi

      - name: Publish the logs to ci-results
        if: always()
        run: |
          git config --global user.name "athanor-ci"; git config --global user.email "ci@athanor.invalid"
          d=$(mktemp -d); git fetch -q --depth 1 origin ci-results && git worktree add -q "$d" FETCH_HEAD && \
            mkdir -p "$d/dna/${GITHUB_SHA}" && \
            cp melting.txt structure.txt work/dna_report.json "$d/dna/${GITHUB_SHA}/" 2>/dev/null || true; \
            mkdir -p "$d/dna/${GITHUB_SHA}/data" && cp core/athanor_core/data/dna/*.json "$d/dna/${GITHUB_SHA}/data/" 2>/dev/null || true; \
            (cd "$d" && git add -A && git commit -qm "dna ${GITHUB_SHA::7}" && git push -q origin HEAD:ci-results) || echo "could not publish"
