name: dna
# DNA Structure benchmarks: helix geometry against crystal structures, melting against measurements.
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/dnadata/**"
      - "core/athanor_core/dna/**"
      - "core/athanor_core/data/dna/**"
      - ".github/workflows/dna.yml"

permissions:
  contents: write

jobs:
  dna:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: dna
          create-args: >-
            python=3.12 numpy scipy biopython=1.84 openmm gargammel=1.1.4
          condarc: |
            channels: [conda-forge, bioconda]
          cache-environment: true

      - name: 3DNA (BSD-3-Clause; the reference for helix geometry)
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch v2.4.9 https://github.com/x3dna-dssr/x3dna-v2.4.git ext/x3dna
          ( cd ext/x3dna/src && make -s >/dev/null )
          ls ext/x3dna/bin

      - name: Helix data and benchmarks (PDB crystal duplexes vs 3DNA)
        run: |
          set +e
          python tools/dnadata/make_data.py ext/x3dna core/athanor_core/data/dna > structure.txt 2>&1
          python tools/dnadata/build_dna.py "$PWD/ext/x3dna" core/athanor_core/data/dna work >> structure.txt 2>&1
          rc=$?
          cut -c1-400 structure.txt | grep -v "^ " | head -200
          msg=$(grep -E "^\[(PASS|FAIL)\]" structure.txt | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          if [ $rc -eq 0 ]; then echo "::notice title=helix geometry::$msg"; else echo "::error title=helix geometry failed::$msg"; fi
          exit $rc

      - name: Melting temperatures (Owczarzy 2004 measurements, Biopython)
        if: always()
        run: |
          set +e
          python tools/dnadata/validate_melting.py core/athanor_core/data/dna/melting_validation.json > melting.txt 2>&1
          rc=$?
          cat melting.txt
          msg=$(grep -E "^\[(PASS|FAIL)\]" melting.txt | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          if [ $rc -eq 0 ]; then echo "::notice title=melting::$msg"; else echo "::error title=melting failed::$msg"; fi
          exit $rc

      - name: Ancient-damage formulas vs gargammel's deamSim
        if: always()
        run: |
          set +e
          python tools/dnadata/damage_bench.py work-damage > damage.txt 2>&1
          rc=$?
          cat damage.txt
          msg=$(grep -E "^\[(PASS|FAIL)\]" damage.txt | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          if [ $rc -eq 0 ]; then echo "::notice title=ancient damage::$msg"; else echo "::error title=ancient damage failed::$msg"; tail -30 damage.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=log tail::/'; echo; fi
          exit $rc

      - name: Scales - nucleosome, protein-DNA complexes, chromatin fibre, nucleus
        if: always()
        run: |
          set +e
          python tools/dnadata/scales.py core/athanor_core/data/dna/scales work-scales > scales.txt 2>&1
          rc=$?
          cat scales.txt | cut -c1-400
          msg=$(grep -E "^\[(PASS|FAIL)\]" scales.txt | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          if [ $rc -eq 0 ]; then echo "::notice title=scales::$msg"; else echo "::error title=scales failed::$msg"; tail -30 scales.txt | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=log tail::/'; echo; fi
          exit $rc

      - name: Reference sequence around the Personal Genome trait variants (Ensembl GRCh37)
        if: always()
        run: python tools/dnadata/flanks.py core/athanor_core/data/dna/flanks.json

      - name: Committed data/dna files regenerate exactly
        if: always()
        run: |
          git diff --stat core/athanor_core/data/dna
          if [ -n "$(git status --porcelain core/athanor_core/data/dna)" ]; then
            git status --short core/athanor_core/data/dna
            echo "::error title=helix data::the committed data/dna files differ from the regenerated ones"; exit 1
          fi

      - name: Publish the logs to ci-results
        if: always()
        run: |
          git config --global user.name "athanor-ci"; git config --global user.email "ci@athanor.invalid"
          d=$(mktemp -d); git fetch -q --depth 1 origin ci-results && git worktree add -q "$d" FETCH_HEAD && \
            mkdir -p "$d/dna/${GITHUB_SHA}" && \
            cp melting.txt structure.txt damage.txt scales.txt work/dna_report.json "$d/dna/${GITHUB_SHA}/" 2>/dev/null || true; \
            mkdir -p "$d/dna/${GITHUB_SHA}/data" && cp core/athanor_core/data/dna/*.json "$d/dna/${GITHUB_SHA}/data/" 2>/dev/null || true; \
            (cd "$d" && git add -A && git commit -qm "dna ${GITHUB_SHA::7}" && git push -q origin HEAD:ci-results) || echo "could not publish"

  dnashape:
    # Deep DNAshape weights exported from the original TensorFlow checkpoints, and Athanor's NumPy
    # implementation checked against the original
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: dnashape
          create-args: python=3.11 pip
          condarc: |
            channels: [conda-forge]
      - name: Export and check
        run: |
          pip install -q tensorflow-cpu==2.15.1 numpy==1.23.5
          set +e
          python tools/dnadata/dnashape_export.py core/athanor_core/data/dna/dnashape work > dnashape.txt 2>&1
          rc=$?
          grep -v "tensorflow/core\|cpu_feature_guard\|rebuild TensorFlow" dnashape.txt | tail -60
          exit $rc
      - name: Committed Deep DNAshape files regenerate exactly
        if: always()
        run: |
          if [ -n "$(git status --porcelain core/athanor_core/data/dna/dnashape)" ]; then
            git status --short core/athanor_core/data/dna/dnashape
            echo "::error title=dnashape data::the committed files differ from the regenerated ones"; exit 1
          fi
      - name: Publish
        if: always()
        run: |
          git config --global user.name "athanor-ci"; git config --global user.email "ci@athanor.invalid"
          for i in 1 2 3; do
            d=$(mktemp -d); git fetch -q --depth 1 origin ci-results && git worktree add -q "$d" FETCH_HEAD && \
              mkdir -p "$d/dna/${GITHUB_SHA}/dnashape" && cp dnashape.txt work/dnashape_report.json core/athanor_core/data/dna/dnashape/* "$d/dna/${GITHUB_SHA}/dnashape/" 2>/dev/null; \
              (cd "$d" && git add -A && git commit -qm "dnashape ${GITHUB_SHA::7}" && git push -q origin HEAD:ci-results) && break
            git worktree remove --force "$d"; sleep $((RANDOM % 20 + 5))
          done
