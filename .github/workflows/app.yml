name: app
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a signed release with this version (e.g. 0.1.1); leave empty for a private test build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: core/environment.yml
          init-shell: bash
          cache-environment: true

      - name: Fast benchmark for the Validation view
        working-directory: core
        run: |
          pip install --no-deps -e .
          python -m athanor_core.benchmark --tiers mmff94,gfn2-xtb --out ../bench-fast || true

      - name: Latest DFT benchmark from CI results
        run: |
          git fetch --depth 50 origin ci-results:ci-results 2>/dev/null || true
          f=latest/Linux/bench-dft-Linux/benchmark.json
          if git cat-file -e "ci-results:$f" 2>/dev/null; then mkdir -p bench-dft && git show "ci-results:$f" > bench-dft/benchmark.json; echo "using $f"; else echo "no DFT benchmark published yet"; fi

      - name: Pack the science runtime
        run: |
          pip uninstall -y athanor-core
          micromamba install -y -n athanor-core -c conda-forge conda-pack
          micromamba list -n athanor-core --explicit --md5 > env-lock.txt
          mkdir -p app/src-tauri/resources/runtime
          conda-pack -p "$CONDA_PREFIX" -o app/src-tauri/resources/runtime/env.tar.gz --format tar.gz --compress-level 6 --n-threads -1 --ignore-missing-files
          ls -la app/src-tauri/resources/runtime
          python app/scripts/prepare_runtime.py --lock env-lock.txt --bench bench-fast/benchmark.json bench-dft/benchmark.json

      - name: Smoke-test the packed runtime (as the installed app runs it)
        id: smoke
        continue-on-error: true
        run: |
          set +e
          python app/scripts/smoke_runtime.py app/src-tauri/resources/runtime > smoke.txt 2>&1
          rc=$?
          cat smoke.txt
          if [ $rc -eq 0 ]; then
            echo "::notice title=runtime-smoke::$(grep -E 'SMOKE_OK|engines:|extracted' smoke.txt | tr '\n' ' ' | cut -c1-3000)"
          else
            msg=$(tail -c 3500 smoke.txt | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=runtime-smoke failed (exit $rc)::$msg"
          fi
          # full log on the results branch (job logs are not always reachable)
          git config --global user.name "athanor-ci"; git config --global user.email "ci@athanor.invalid"
          d=$(mktemp -d); git fetch -q --depth 1 origin ci-results && git worktree add -q "$d" FETCH_HEAD && \
            mkdir -p "$d/app/${GITHUB_SHA}" && cp smoke.txt "$d/app/${GITHUB_SHA}/smoke-${GITHUB_RUN_NUMBER}.txt" && \
            (cd "$d" && git add -A && git commit -qm "app smoke log ${GITHUB_SHA::7}" && git push -q origin HEAD:ci-results) || echo "could not publish smoke log"
          exit $rc

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Version and signing
        id: ver
        run: |
          v=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; fi
          if [ -n "$INPUT_RELEASE" ]; then v="${INPUT_RELEASE#v}"; fi
          if [ -n "$v" ]; then
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error title=release blocked::'$v' is not a semantic version"; exit 1; }
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
            python - "$v" <<'PY'
          import json, sys
          p = "app/src-tauri/tauri.conf.json"
          c = json.load(open(p)); c["version"] = sys.argv[1]
          json.dump(c, open(p, "w"), indent=2)
          PY
            [ -n "$SIGNING_KEY" ] || { echo "::error title=release blocked::TAURI_SIGNING_PRIVATE_KEY secret is not set"; exit 1; }
            [ -n "$RELEASES_TOKEN" ] || { echo "::error title=release blocked::RELEASES_TOKEN secret is not set"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$SIGNING_KEY" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi
          echo "::notice title=version::$(python -c "import json;print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])") signed=$([ -n "$SIGNING_KEY" ] && echo yes || echo no)"
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          INPUT_RELEASE: ${{ inputs.release }}

      - name: Build installer
        working-directory: app
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          extra=()
          if [ "${{ steps.ver.outputs.signed }}" != "true" ]; then
            # Without the signing key the updater artifacts cannot be produced.
            extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npx tauri build "${extra[@]}" 2>&1 | tail -40
          test ${PIPESTATUS[0]} -eq 0
          ls -la src-tauri/target/release/bundle/nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Stop here if the runtime smoke test failed
        if: steps.smoke.outcome != 'success'
        run: |
          echo "::error title=release withheld::installer built but not published, because the runtime smoke test failed"
          exit 1

      - name: Publish
        run: |
          dir=app/src-tauri/target/release/bundle/nsis
          exe=$(ls $dir/*-setup.exe | head -1)
          name=$(basename "$exe")
          echo "::notice title=installer::$name ($(du -h "$exe" | cut -f1))"
          if [ "${{ steps.ver.outputs.release }}" = "true" ]; then
            tag="${{ steps.ver.outputs.tag }}"; v="${tag#v}"
            python - "$v" "$tag" "$exe" <<'PY'
          import json, sys, datetime, os
          v, tag, exe = sys.argv[1:]
          sig = open(exe + ".sig").read().strip()
          name = os.path.basename(exe)
          feed = {
              "version": v,
              "notes": open("RELEASE_NOTES.md", encoding="utf-8").read(),
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"windows-x86_64": {
                  "signature": sig,
                  "url": f"https://github.com/0xGrimnir/athanor-releases/releases/download/{tag}/{name}"}},
          }
          json.dump(feed, open("latest.json", "w"), indent=2)
          PY
            GH_TOKEN="$RELEASES_TOKEN" gh release create "$tag" "$exe" "$exe.sig" latest.json \
              --repo 0xGrimnir/athanor-releases --title "Athanor $tag" --notes-file RELEASE_NOTES.md --latest
            echo "::notice title=published::$tag on 0xGrimnir/athanor-releases"
            # Record the release in the source repo too.
            git config --global user.name "athanor-ci"; git config --global user.email "ci@athanor.invalid"
            git tag -a "$tag" -m "Athanor $tag" "$GITHUB_SHA" && git push -q origin "refs/tags/$tag" || echo "::warning::could not tag source repo"
          else
            GH_TOKEN="$GITHUB_TOKEN_" gh release create "build-${GITHUB_RUN_NUMBER}" "$exe" \
              --title "Athanor test build ${GITHUB_RUN_NUMBER}" --notes "Manual build from ${GITHUB_SHA}" --draft
          fi
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GITHUB_TOKEN_: ${{ github.token }}
