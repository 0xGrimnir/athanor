name: app
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: core/environment.yml
          init-shell: bash
          cache-environment: true

      - name: Fast benchmark for the Validation view
        working-directory: core
        run: |
          pip install --no-deps -e .
          python -m athanor_core.benchmark --tiers mmff94,gfn2-xtb --out ../bench-fast || true

      - name: Latest DFT benchmark from CI results
        run: |
          git fetch --depth 50 origin ci-results:ci-results 2>/dev/null || true
          f=latest/Linux/bench-dft-Linux/benchmark.json
          if git cat-file -e "ci-results:$f" 2>/dev/null; then mkdir -p bench-dft && git show "ci-results:$f" > bench-dft/benchmark.json; echo "using $f"; else echo "no DFT benchmark published yet"; fi

      - name: Pack the science runtime
        run: |
          pip uninstall -y athanor-core
          micromamba install -y -n athanor-core -c conda-forge conda-pack
          micromamba list -n athanor-core --explicit --md5 > env-lock.txt
          mkdir -p app/src-tauri/resources/runtime
          conda-pack -p "$CONDA_PREFIX" -o app/src-tauri/resources/runtime/env.tar.gz --format tar.gz --compress-level 6 --n-threads -1 --ignore-missing-files
          ls -la app/src-tauri/resources/runtime
          python app/scripts/prepare_runtime.py --lock env-lock.txt --bench bench-fast/benchmark.json bench-dft/benchmark.json

      - name: Smoke-test the packed runtime (as the installed app runs it)
        id: smoke
        continue-on-error: true
        run: |
          set +e
          python app/scripts/smoke_runtime.py app/src-tauri/resources/runtime > smoke.txt 2>&1
          rc=$?
          cat smoke.txt
          if [ $rc -eq 0 ]; then
            echo "::notice title=runtime-smoke::$(grep -E 'SMOKE_OK|engines:|extracted' smoke.txt | tr '\n' ' ' | cut -c1-3000)"
          else
            msg=$(tail -c 3500 smoke.txt | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=runtime-smoke failed (exit $rc)::$msg"
          fi
          # full log on the results branch (job logs are not always reachable)
          git config --global user.name "athanor-ci"; git config --global user.email "ci@athanor.invalid"
          d=$(mktemp -d); git fetch -q --depth 1 origin ci-results && git worktree add -q "$d" FETCH_HEAD && \
            mkdir -p "$d/app/${GITHUB_SHA}" && cp smoke.txt "$d/app/${GITHUB_SHA}/smoke-${GITHUB_RUN_NUMBER}.txt" && \
            (cd "$d" && git add -A && git commit -qm "app smoke log ${GITHUB_SHA::7}" && git push -q origin HEAD:ci-results) || echo "could not publish smoke log"
          exit $rc

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build installer
        working-directory: app
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx tauri build 2>&1 | tail -40
          test ${PIPESTATUS[0]} -eq 0
          ls -la src-tauri/target/release/bundle/nsis

      - name: Stop here if the runtime smoke test failed
        if: steps.smoke.outcome != 'success'
        run: |
          echo "::error title=release withheld::installer built but not published, because the runtime smoke test failed"
          exit 1

      - name: Publish release (draft for manual builds)
        run: |
          exe=$(ls app/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          size=$(du -h "$exe" | cut -f1)
          echo "::notice title=installer::$(basename "$exe") ($size)"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            gh release create "$tag" "$exe" --title "Athanor $tag" --notes-file RELEASE_NOTES.md --prerelease || gh release upload "$tag" "$exe" --clobber
          else
            gh release create "build-${GITHUB_RUN_NUMBER}" "$exe" --title "Athanor test build ${GITHUB_RUN_NUMBER}" --notes "Manual build from ${GITHUB_SHA}" --draft
          fi
        env:
          GH_TOKEN: ${{ github.token }}
