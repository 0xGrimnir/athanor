[package]
name = "athanor"
version = "0.3.0"
description = "Athanor: a desktop science workbench"
authors = ["Tyler Lee Jones"]
edition = "2021"
publish = false

[lib]
name = "athanor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.14"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
