# Science core environment (conda-forge). Used by CI and bundled into the
# Windows installer. Versions are pinned by the lockfile generated in CI.
name: athanor-core
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - scipy
  - rdkit
  - tblite-python
  - xtb>=6.7.1        # older builds write different output formats; Windows uses the program as its GFN2 engine
  - psi4
  - ase
  - pytest
